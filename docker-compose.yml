services:
  isansw-postgres:
    container_name: isansw-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    networks:
      - isansw-network
    volumes:
      - isansw-data:/var/lib/postgresql/data 

  isansw-mailhog:
    container_name: isansw-mailhog
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1027:1025" # The SMTP port for sending emails
      - "8027:8025" # The Mailhog email inbox UI port
    networks:
      - isansw-network

networks:
  isansw-network:

volumes:
  isansw-data: